# No symlinks, recursive chmod, production mounts or shared hosting paths.
d /etc/novalvion-ps-sandbox 0755 root root -
d /opt/novalvion-ps-sandbox 0750 root novalvion-ps-sandbox -
d /srv/novalvion-ps-sandbox 0750 root novalvion-ps-sandbox -
d /srv/novalvion-ps-sandbox/uploads 0750 root novalvion-ps-sandbox -
# Preprovision required structural company/category folders as root; grant only
# the reviewed leaf directories to runtime. No upload use until that inventory.
d /var/lib/novalvion-ps-db 0700 novalvion-ps-db novalvion-ps-db -
d /var/backups/novalvion-ps-sandbox 0700 root root -
d /var/lib/novalvion-ps-build 0700 novalvion-ps-build novalvion-ps-build -
