# Dedicated VM only. Review with console access BEFORE loading. No global flush.
# Intentionally NO SSH, DNS, Internet, VPN, production or PriceSmart exceptions.
table inet novalvion_ps_sandbox {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state invalid drop
    iifname "lo" ip saddr 127.0.0.1 ip daddr 127.0.0.1 ct state established accept
    iifname "lo" ip saddr 127.0.0.1 ip daddr 127.0.0.1 tcp dport { 3000, 4316, 43306 } accept
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
  }
  chain output {
    type filter hook output priority 0; policy drop;
    ct state invalid drop
    oifname "lo" ip saddr 127.0.0.1 ip daddr 127.0.0.1 ct state established accept
    oifname "lo" ip saddr 127.0.0.1 ip daddr 127.0.0.1 tcp dport { 3000, 4316, 43306 } accept
  }
}
