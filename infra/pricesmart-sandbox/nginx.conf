# Dedicated non-root instance, not the distribution/global nginx config.
pid /run/novalvion-ps-proxy/nginx.pid;
error_log stderr warn;
events { worker_connections 128; }
http {
  access_log off;
  client_body_temp_path /run/novalvion-ps-proxy/body;
  proxy_temp_path /run/novalvion-ps-proxy/proxy;
  server {
    listen 127.0.0.1:4316 ssl;
    server_name localhost;
    ssl_certificate /etc/novalvion-ps-sandbox/tls/server.crt;
    ssl_certificate_key /etc/novalvion-ps-sandbox/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    if ($host != localhost) { return 444; }
    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_buffering off;
    }
  }
}
